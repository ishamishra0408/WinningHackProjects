# SonarQube Cloud analysis settings.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/languages/python/

# Accepted format is a comma-separated list of "X.Y" versions. There is no range
# syntax. Sonar reports only issues valid for EVERY version listed, so adding an
# older version makes the analysis stricter, not broader.
#
# Floor is 3.9, and it is a hard floor: builder/generate-gate.py annotates its
# function signatures with PEP 585 builtin generics (dict[...], list[...],
# re.Match[...]) and does not `from __future__ import annotations`, so those
# annotations are evaluated at import time. On 3.8 that raises TypeError.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13

# Only needed for the CLI scanner / GitHub Action. Automatic Analysis takes both
# from the project binding, so leave them commented unless you run the scanner.
# sonar.projectKey=<organization>_WinningHackProjects
# sonar.organization=<organization>
