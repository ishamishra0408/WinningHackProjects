# SonarQube Cloud analysis settings, for AUTOMATIC ANALYSIS.
#
# The filename matters. Automatic Analysis reads `.sonarcloud.properties` and
# explicitly IGNORES `sonar-project.properties` -- that one is only read by the
# CI-based scanner. If you ever switch to the CLI scanner or the GitHub Action,
# rename this file to sonar-project.properties and add projectKey/organization.
#
# It also only takes effect from the repository's DEFAULT BRANCH. On a feature
# branch this file changes nothing until it is merged.
#
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

# Accepted format is a comma-separated list of "X.Y" versions. There is no range
# syntax. Sonar reports only issues valid for EVERY version listed, so adding an
# older version makes the analysis stricter, not broader.
#
# Floor is 3.9, and it is a hard floor: builder/generate-gate.py annotates its
# function signatures with PEP 585 builtin generics (dict[...], list[...],
# re.Match[...]) and does not `from __future__ import annotations`, so those
# annotations are evaluated at import time. On 3.8 that raises TypeError.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13
